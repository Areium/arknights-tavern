<title>Arknights Tavern · 主页设计台（HomeMenu 现状基线）</title>

<!--
  ═══════════════════════════════════════════════════════════════════════════
  主页（HomeMenu）独立预览稿 —— 现状基线 + 设计台
  ═══════════════════════════════════════════════════════════════════════════

  【这是什么】
  把 frontend/src/components/HomeMenu.tsx + style.css 的 .home-menu-* 区段
  + styles/skin-prts.css / skin-tavern.css 的主页覆盖，抽成一个可直接双击打开的
  独立 HTML。目的：不启动 Electron / Vite / Flask 后端，就能对主页做视觉设计迭代。

  【与产品代码的关系】
  · 本文件不接入构建，不参与打包，改它不会影响运行时（与同目录 01~04 稿一致）。
  · DOM 结构与 CSS 数值是 1:1 抄录现状，作为「改之前长什么样」的基线。
  · 唯一的结构性差异：把所有散落的硬编码值上提到了「设计令牌」区（CSS 变量）。
    产品代码刻意「不做 CSS 变量重构」（见 AGENTS.md），那是生产约束；
    本预览稿是设计台，变量化恰恰是为了让改配色/改版式只动十几行。
  · 产品里由 Tailwind preflight 提供的基线（box-sizing、line-height:1.5、h1 归一化、
    img 块级）在本文件「1. 基础」区手工补齐 —— 少了 line-height，文字块会比真实
    应用矮一截，量出来的面板高度就不作数了。

  【怎么用】
  · 双击打开即可。资源用相对路径 ../frontend/public/{menu_bg.jpg,logo.png}，
    所以请保持 ui-styles/ 与 frontend/ 的相对位置（移动文件会丢背景图，届时回落到渐变底）。
  · 右下角「设计台」按钮（或按 D）→ 切皮肤 / 模拟状态 / 调版式 / 试强调色 / 换画布尺寸。
  · 快捷键：D 开关设计台 · 1/2/3 切皮肤 · R 重置 · Esc 关闭设计台。
  · URL 参数可复现某个状态（便于截图评审 / 发给别人看）：
      ?skin=tavern|prts|default  ?accent=holo|amber|seal|jade|skin
      ?gate=1  ?backend=0  ?llm=0  ?sessions=5  ?combat=2
      ?width=30  ?radius=0.5  ?alpha=0.6  ?dim=0.8  ?canvas=390x844
  · 删掉「设计台」那一段 HTML + <script>，剩下的就是纯净的 1:1 基线。

  【现状问题（无头 Chrome 实测得出，非目测；改版时可一并处理）】
  1. 默认 / PRTS 皮肤的主标题折成两行。Orbitron 700 / 23.2px / 0.3em 字距实测需
     392px，而栏目内容宽只有 358px（416 − 2×28 padding − 2×1 border）。面板因此
     比单行时高 39px。tavern 皮肤是单行 —— 因为它已把标题收紧到 1.28rem / 0.14em：
     同一个坑，只有衬线那版填了。
  2. 面板与底部状态栏在矮视口重叠。.home-menu-stage 按整个视口高度居中，没给
     38px 状态栏留位置；面板又随宽度变窄而变高。实测 360×740 起重叠
     （面板底 752 > 状态栏顶 734），320×568 时面板 700px 高过画布 568px。
  3. 底部状态栏在窄屏被裁。内容实测需 351px（LLM 名短）～507px（provider 名长），
     而窄屏容器只有屏宽；配合 justify-content:center + 根部 overflow:hidden，
     溢出时两端同时被切 —— 实测 390px 手机配长 provider 名，音量条直接被切掉。
  4. tavern 皮肤的闸门标题渐变与 logo 辉光仍是琥珀金：skin-tavern.css 只改了衬线
     字体 / 字号 / 字距，没改 linear-gradient 与 box-shadow，金压在羊皮纸上偏脏。
  5. 版本号 v0.1.0 硬编码在组件里（frontend/package.json 的 version 目前也是 0.1.0，
     暂时不会不一致）。
  ═══════════════════════════════════════════════════════════════════════════
-->

/* ═══════════════════════════════════════════════════════════════════════════
   1. 基础
   ═══════════════════════════════════════════════════════════════════════════ */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }

/* Tailwind preflight 等价基线（产品里由 @tailwind base 提供）。
   line-height:1.5 很关键 —— 少了它，文字块高度会比真实应用矮一截。 */
html { line-height: 1.5; -webkit-text-size-adjust: 100%; }
body { line-height: inherit; }
h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; }
img, svg, video, canvas { display: block; vertical-align: middle; }

body {
  font-family: var(--hm-font-ui);
  background: #05060a;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: none; }

/* 现状：style.css @layer base 给「所有元素」挂了 300ms 的颜色过渡。
   必须放在组件规则之前 —— 组件自带的 transition 要比它后出现才能生效。 */
.home-menu-root *,
.home-menu-root *::before,
.home-menu-root *::after {
  transition-property: background-color, border-color, color;
  transition-duration: 300ms;
  transition-timing-function: ease-in-out;
}

/* 产品里由 App.tsx 的 h-screen w-screen flex 容器提供满屏，这里等价复刻 */
.home-menu-root {
  position: relative;
  height: 100%;
  width: 100%;
  overflow: hidden;
  /* 背景图 + 兜底渐变（图缺失时不留白） */
  background-image: var(--hm-bg-image), linear-gradient(160deg, #101526 0%, #0a0c12 55%, #05060a 100%);
  background-size: cover, cover;
  background-position: center, center;
  background-color: var(--hm-bg-color);
}

/* 画布模式（设计台）：固定尺寸居中，模拟不同视口 */
body.canvas-fixed { background: #16181f; }
body.canvas-fixed .home-menu-root {
  position: fixed;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  height: auto;
  box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16), 0 30px 90px -20px rgba(0, 0, 0, 0.8);
}
body.canvas-fixed::before {
  content: attr(data-canvas-label);
  position: fixed; left: 12px; top: 10px; z-index: 999;
  font: 500 11px/1 "JetBrains Mono", monospace;
  letter-spacing: .08em; color: rgba(255, 255, 255, .45);
  pointer-events: none;
}

    radial-gradient(120% 90% at 50% 30%, var(--hm-vig-core) 0%, var(--hm-vig-mid) 62%, var(--hm-vig-edge) 100%),
    linear-gradient(to bottom, var(--hm-vig-top) 0%, var(--hm-vig-30) 30%, var(--hm-vig-60) 60%, var(--hm-vig-bottom) 100%);
}

/* ═══════════════════════════════════════════════════════════════════════════
   3. 点击进入闸门（style.css L1112-1152）
   ═══════════════════════════════════════════════════════════════════════════ */
.home-splash {
  position: absolute;
  inset: 0;
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  background: var(--hm-splash-bg);
  backdrop-filter: blur(6px);
  cursor: pointer;
  user-select: none;
  animation: home-fade-in 0.6s ease-out;
}
.home-splash[hidden] { display: none; }
.home-splash-logo {
  width: 96px;
  height: 96px;
  border-radius: 20px;
  box-shadow: var(--hm-splash-logo-glow);
  animation: home-logo-breathe 3.2s ease-in-out infinite;
}
.home-splash-title {
  font-family: var(--hm-splash-title-font);
  font-size: var(--hm-splash-title-size);
  letter-spacing: var(--hm-splash-title-ls);
  text-indent: var(--hm-splash-title-ls);
  font-weight: 700;
  background: linear-gradient(120deg, var(--hm-splash-g1) 0%, var(--hm-splash-g2) 50%, var(--hm-splash-g3) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: var(--hm-splash-title-shadow);
}
.home-splash-press {
  margin-top: 14px;
  font-size: 13px;
  letter-spacing: 0.5em;
  text-indent: 0.5em;
  color: var(--hm-splash-press);
  animation: home-press-pulse 1.8s ease-in-out infinite;
}

/* ═══════════════════════════════════════════════════════════════════════════
   4. 主菜单舞台（style.css L1155-1323）
   ═══════════════════════════════════════════════════════════════════════════ */
.home-menu-stage {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transform: translateY(10px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.home-menu-stage.entered { opacity: 1; pointer-events: auto; transform: none; }

.home-menu-column {
  width: 100%;
  max-width: var(--hm-col-maxw);
  margin: 0 1.5rem;
  padding: 2rem 1.75rem 1.75rem;
  border-radius: var(--hm-panel-radius);
  border: 1px solid var(--hm-panel-border);
  background: linear-gradient(
    170deg,
    rgba(var(--hm-panel-rgb-1), calc(var(--hm-panel-a1) * var(--hm-panel-alpha))),
    rgba(var(--hm-panel-rgb-2), calc(var(--hm-panel-a2) * var(--hm-panel-alpha)))
  );
  backdrop-filter: blur(var(--hm-panel-blur));
  box-shadow: var(--hm-panel-shadow), var(--hm-panel-inset);
}

/* ── 标题区 ── */
.home-menu-head { text-align: center; }
.home-menu-logo {
  width: 68px;
  height: 68px;
  margin: 0 auto 12px;
  border-radius: 16px;
  box-shadow: 0 0 30px rgba(245, 158, 11, 0.28);
  display: block;
}
.home-menu-title {
  font-family: var(--hm-title-font);
  font-size: var(--hm-title-size);
  font-weight: 800;
  letter-spacing: var(--hm-title-ls);
  text-indent: var(--hm-title-ls);
  background: linear-gradient(120deg, var(--hm-title-g1) 0%, var(--hm-title-g2) 45%, var(--hm-title-g3) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  text-shadow: var(--hm-title-shadow);
}
.home-menu-sub {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 0.42em;
  text-indent: 0.42em;
  color: var(--hm-sub-color);
}
.home-menu-divider { display: flex; align-items: center; gap: 10px; margin: 16px 8px 0; }
.home-menu-divider::before,
.home-menu-divider::after {
  content: "";
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, transparent, rgba(var(--hm-div-rgb), var(--hm-div-alpha)));
}
.home-menu-divider::after { background: linear-gradient(to left, transparent, rgba(var(--hm-div-rgb), var(--hm-div-alpha))); }
.home-menu-divider span {
  width: 7px;
  height: 7px;
  transform: rotate(45deg);
  background: linear-gradient(135deg, var(--hm-dot-1), var(--hm-dot-2));
  box-shadow: var(--hm-dot-shadow);
}

/* ── 菜单项 ── */
.home-menu-nav { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
.home-menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 14px;
  border-radius: 12px;
  border: 1px solid var(--hm-item-border);
  background: var(--hm-item-bg);
  text-align: left;
  transition: transform 0.16s ease, border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
  animation: home-item-in 0.5s ease-out backwards;
}
.home-menu-nav .home-menu-item:nth-child(1) { animation-delay: 0.05s; }
.home-menu-nav .home-menu-item:nth-child(2) { animation-delay: 0.11s; }
.home-menu-nav .home-menu-item:nth-child(3) { animation-delay: 0.17s; }
.home-menu-nav .home-menu-item:nth-child(4) { animation-delay: 0.23s; }
.home-menu-nav .home-menu-item:nth-child(5) { animation-delay: 0.29s; }
.home-menu-nav .home-menu-item:nth-child(6) { animation-delay: 0.35s; }
.home-menu-item:hover {
  transform: translateX(4px);
  border-color: var(--hm-item-hover-border);
  background: var(--hm-item-hover-bg);
  box-shadow: var(--hm-item-hover-shadow);
}
.home-menu-item:active { transform: translateX(4px) scale(0.99); }
.home-menu-item-icon {
  width: 30px;
  text-align: center;
  font-size: 17px;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5));
}
.home-menu-item-text { flex: 1; min-width: 0; }
.home-menu-item-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--hm-label-font);
  font-size: 13.5px;
  font-weight: 600;
  color: var(--hm-label-color);
  letter-spacing: var(--hm-label-ls);
}
.home-menu-item-desc {
  display: block;
  margin-top: 1px;
  font-size: 10.5px;
  color: var(--hm-desc-color);
  letter-spacing: 0.04em;
}
.home-menu-item-badge {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 7px;
  border-radius: 999px;
  color: var(--hm-badge-color);
  background: var(--hm-badge-bg);
  border: 1px solid var(--hm-badge-border);
}
.home-menu-item-badge[hidden] { display: none; }
.home-menu-item-arrow {
  font-size: 10px;
  color: var(--hm-arrow-color);
  opacity: 0;
  transform: translateX(-4px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}
.home-menu-item:hover .home-menu-item-arrow { opacity: 1; transform: none; }

/* 主入口强调 */
.home-menu-item.primary {
  padding: 13px 16px;
  border-color: var(--hm-prim-border);
  background: linear-gradient(135deg, rgba(var(--hm-prim-rgb-1), var(--hm-prim-a1)), var(--hm-prim-2));
  box-shadow: var(--hm-prim-shadow), var(--hm-prim-inset);
}
.home-menu-item.primary .home-menu-item-label { color: var(--hm-prim-label); font-size: 14.5px; }
.home-menu-item.primary:hover {
  border-color: var(--hm-prim-h-border);
  background: linear-gradient(135deg, rgba(var(--hm-prim-rgb-1), var(--hm-prim-h-a1)), var(--hm-prim-h-2));
  box-shadow: var(--hm-prim-h-shadow), var(--hm-prim-h-inset);
}

/* ═══════════════════════════════════════════════════════════════════════════
   5. 底部状态栏（style.css L1326-1357 + L1424-1430）
   ═══════════════════════════════════════════════════════════════════════════ */
.home-menu-footer {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  font-size: 11px;
  color: var(--hm-footer-color);
  z-index: 10;
}
.home-status { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.home-status .dot {
  width: 7px; height: 7px;
  border-radius: 999px;
  display: inline-block;
}
.home-status .dot.ok  { background: var(--hm-dot-ok);  box-shadow: var(--hm-dot-ok-glow); }
.home-status .dot.bad { background: var(--hm-dot-bad); box-shadow: var(--hm-dot-bad-glow); }
.home-menu-version { color: var(--hm-version-color); letter-spacing: 0.08em; }
.home-audio-group { display: inline-flex; align-items: center; gap: 8px; }
.home-audio-btn {
  padding: 3px 8px;
  border-radius: 8px;
  border: 1px solid var(--hm-audio-border);
  background: var(--hm-audio-bg);
  transition: background-color 0.2s ease;
}
.home-audio-btn:hover { background: var(--hm-audio-hover-bg); }
.home-vol-slider { width: 90px; accent-color: var(--hm-slider-accent); cursor: pointer; }

/* ═══════════════════════════════════════════════════════════════════════════
   6. 动效
   ═══════════════════════════════════════════════════════════════════════════ */
@keyframes home-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes home-logo-breathe {
  0%, 100% { transform: scale(1);      box-shadow: 0 0 42px rgba(245, 158, 11, 0.3); }
  50%      { transform: scale(1.045);  box-shadow: 0 0 60px rgba(245, 158, 11, 0.5); }
}
@keyframes home-press-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
@keyframes home-item-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .home-splash, .home-splash-logo, .home-splash-press, .home-menu-item, .home-menu-stage {
    animation: none !important;
    transition: opacity 0.01ms !important;
  }
}

/* 浅色主题下主页保持深色沉浸（现状如此，故本稿不提供 light 变体） */

/* ═══════════════════════════════════════════════════════════════════════════
   7. 设计台（非产品代码 —— 仅供本预览页调参，删掉不影响基线）
   ═══════════════════════════════════════════════════════════════════════════ */
.bench-fab {
  position: fixed; right: 16px; bottom: 16px; z-index: 200;
  padding: 8px 14px; border-radius: 999px;
  font: 600 12px/1 "JetBrains Mono", monospace; letter-spacing: .06em;
  color: #0b0d12; background: #f0c060;
  box-shadow: 0 8px 24px -8px rgba(240, 192, 96, .7);
}
.bench-fab:hover { background: #ffd98a; }

.bench {
  position: fixed; right: 0; top: 0; bottom: 0; z-index: 190;
  width: 310px; overflow-y: auto; padding: 14px 16px 40px;
  background: rgba(16, 18, 24, 0.97);
  border-left: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: -20px 0 60px -20px rgba(0, 0, 0, 0.9);
  color: #d7dbe4;
  font: 12px/1.5 var(--hm-font-ui);
  backdrop-filter: blur(14px);
}
.bench[hidden] { display: none; }
.bench-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 4px; }
.bench-head h2 { font-size: 13px; letter-spacing: .08em; color: #f0c060; }
.bench-head span { font: 400 10px/1 "JetBrains Mono", monospace; color: #5d6472; }
.bench-note {
  margin: 8px 0 14px; padding: 7px 9px; border-radius: 6px;
  font-size: 10.5px; line-height: 1.55; color: #8ea0b5;
  background: rgba(56, 189, 248, 0.07); border: 1px solid rgba(56, 189, 248, 0.18);
}
.bench section { margin-bottom: 16px; }
.bench h3 {
  font: 600 10px/1 "JetBrains Mono", monospace; letter-spacing: .14em;
  color: #6b7484; text-transform: uppercase;
  padding-bottom: 6px; margin-bottom: 9px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}
.bench-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.bench-row > label { font-size: 11.5px; color: #aeb6c4; }
.bench-seg { display: flex; gap: 4px; flex-wrap: wrap; }
.bench-seg button {
  padding: 5px 9px; border-radius: 6px; font-size: 11px;
  border: 1px solid rgba(255, 255, 255, 0.13); background: rgba(255, 255, 255, 0.04);
  color: #c3cad6; transition: all .15s;
}
.bench-seg button:hover { border-color: rgba(240, 192, 96, .5); }
.bench-seg button.on {
  border-color: #f0c060; background: rgba(240, 192, 96, .16); color: #ffd98a; font-weight: 600;
}
.bench-slider { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
.bench-slider label { flex: 0 0 74px; font-size: 11px; color: #aeb6c4; }
.bench-slider input[type=range] { flex: 1; accent-color: #f0c060; min-width: 0; }
.bench-slider output {
  flex: 0 0 46px; text-align: right;
  font: 400 10.5px/1 "JetBrains Mono", monospace; color: #7f8899;
}
.bench-switch { display: flex; gap: 4px; }
.bench-switch button {
  flex: 1; padding: 5px 0; border-radius: 6px; font-size: 11px;
  border: 1px solid rgba(255, 255, 255, 0.13); background: rgba(255, 255, 255, 0.04); color: #c3cad6;
}
.bench-switch button.on { border-color: #4ade80; background: rgba(74, 222, 128, .14); color: #86efac; }
.bench-switch button.off { border-color: #f87171; background: rgba(248, 113, 113, .13); color: #fca5a5; }
.bench-swatches { display: flex; gap: 6px; }
.bench-swatches button {
  flex: 1; height: 26px; border-radius: 6px;
  border: 1px solid rgba(255, 255, 255, 0.18);
}
.bench-swatches button.on { outline: 2px solid #fff; outline-offset: 1px; }
.bench select {

  background: #1b1f28; color: #d7dbe4;
  border: 1px solid rgba(255, 255, 255, 0.13);
  font: 11px var(--hm-font-ui);
}
.bench-reset {
  width: 100%; padding: 8px 0; border-radius: 8px; font-size: 11.5px;
  border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.05); color: #d7dbe4;
}

.bench code { font: 400 10px "JetBrains Mono", monospace; color: #7f8899; }
</style>
</head>

<!-- ═══════════════════════════════════════════════════════════════════════

      <output id="combatOut">1</output>
    </div>
  </section>

  <section>
    <h3>版式</h3>
    <div class="bench-slider">
      <label>栏目宽</label>
      <input type="range" id="wRange" min="20" max="44" step="0.5" value="26">
      <output id="wOut">26rem</output>
    </div>
    <div class="bench-slider">
      <label>面板圆角</label>
      <input type="range" id="rRange" min="0" max="2.5" step="0.05" value="1.25">
      <output id="rOut">1.25rem</output>
    </div>
    <div class="bench-slider">
      <label>面板不透明</label>
      <input type="range" id="aRange" min="0.3" max="1" step="0.01" value="1">
      <output id="aOut">100%</output>
    </div>
    <div class="bench-slider">
      <label>背景压暗</label>
      <input type="range" id="dRange" min="0" max="1.5" step="0.05" value="1">
      <output id="dOut">100%</output>
    </div>
  </section>

  <section>
    <h3>强调色探索（覆盖当前皮肤）</h3>
    <div class="bench-swatches" id="accentSeg">
      <button data-accent="skin"  class="on" style="background:linear-gradient(120deg,#fde68a,#f59e0b)" title="跟随皮肤"></button>
      <button data-accent="amber" style="background:linear-gradient(120deg,#fde68a,#d97706)" title="琥珀（现状）"></button>
      <button data-accent="holo"  style="background:linear-gradient(120deg,#bae6fd,#0284c7)" title="全息青"></button>
      <button data-accent="seal"  style="background:linear-gradient(120deg,#f0b4a6,#7c2d20)" title="火漆红"></button>
      <button data-accent="jade"  style="background:linear-gradient(120deg,#bbf7d0,#047857)" title="苔绿"></button>
    </div>
    <p style="margin-top:8px"><code id="accentHint">跟随皮肤（不改任何变量）</code></p>
  </section>

  <section>
    <h3>画布（响应式检查）</h3>
    <select id="canvasSel">
      <option value="fit">自适应窗口</option>
      <option value="1920x1080">1920 × 1080 · 桌面</option>
      <option value="1600x900">1600 × 900 · 笔记本</option>
      <option value="1366x768">1366 × 768 · 小笔记本</option>
      <option value="1024x640">1024 × 640 · 窗口化</option>
      <option value="390x844">390 × 844 · 手机（复现状态栏溢出）</option>
    </select>
  </section>

  <button class="bench-reset" id="resetAll">↺ 全部重置</button>
</aside>

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   设计台逻辑（非产品代码）
   ═══════════════════════════════════════════════════════════════════════════ */
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var root = document.documentElement;

  /* ── 强调色预设：hi/mid/deep 三色，其余 rgba 由结构派生 ── */
  var ACCENTS = {
    amber: { hi: "#fde68a", mid: "#f59e0b", deep: "#b45309" },
    holo:  { hi: "#bae6fd", mid: "#38bdf8", deep: "#0284c7" },
    seal:  { hi: "#f0b4a6", mid: "#a03d2d", deep: "#7c2d20" },
    jade:  { hi: "#bbf7d0", mid: "#34d399", deep: "#047857" }
  };
  function rgbOf(hex) {
    var n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255].join(", ");
  }
  /* 一次性写出预设涉及的全部变量，保证与 token 块同构 */
  function accentVars(a) {
    var rMid = rgbOf(a.mid), rDeep = rgbOf(a.deep), rHi = rgbOf(a.hi);
    return {
      "--hm-title-g1": a.hi, "--hm-title-g2": a.mid, "--hm-title-g3": a.hi,
      "--hm-title-shadow": "0 2px 24px rgba(" + rMid + ", 0.28)",
      "--hm-div-rgb": rMid, "--hm-div-alpha": "0.45",
      "--hm-dot-1": a.hi, "--hm-dot-2": a.deep,
      "--hm-dot-shadow": "0 0 10px rgba(" + rMid + ", 0.6)",
      "--hm-badge-color": a.hi,
      "--hm-badge-bg": "rgba(" + rMid + ", 0.14)",
      "--hm-badge-border": "rgba(" + rMid + ", 0.3)",
      "--hm-arrow-color": a.hi,
      "--hm-item-hover-border": "rgba(" + rHi + ", 0.4)",
      "--hm-item-hover-bg": "rgba(" + rHi + ", 0.07)",
      "--hm-item-hover-shadow": "0 4px 22px -8px rgba(" + rMid + ", 0.35)",
      "--hm-prim-border": "rgba(" + rMid + ", 0.45)",
      "--hm-prim-rgb-1": rMid, "--hm-prim-a1": "0.16",
      "--hm-prim-2": "rgba(" + rDeep + ", 0.10)",
      "--hm-prim-shadow": "0 6px 26px -10px rgba(" + rMid + ", 0.4)",
      "--hm-prim-label": a.hi,
      "--hm-prim-h-border": "rgba(" + rHi + ", 0.7)",
      "--hm-prim-h-a1": "0.24",
      "--hm-prim-h-2": "rgba(" + rDeep + ", 0.16)",
      "--hm-prim-h-shadow": "0 8px 32px -10px rgba(" + rMid + ", 0.55)",
      "--hm-slider-accent": a.mid
    };
  }
  var ACCENT_VAR_NAMES = Object.keys(accentVars(ACCENTS.amber));

  function defaults() {
    return {
      skin: "default", accent: "skin", gate: false,
      backend: true, llm: true, sessions: 3, combat: 1,
      width: 26, radius: 1.25, alpha: 1, dim: 1, canvas: "fit"
    };
  }
  var state = defaults();

  /* ── URL 参数：便于分享 / 复现某个设计状态 ──
     例：05-home-menu.html?skin=tavern&gate=1&sessions=5&combat=2&canvas=390x844&accent=holo */
  function readQuery() {
    var q = new URLSearchParams(location.search);
    var pick = function (key, list) { return list.indexOf(q.get(key)) >= 0 ? q.get(key) : null; };
    state.skin = pick("skin", ["default", "prts", "tavern"]) || state.skin;
    state.accent = pick("accent", ["skin"].concat(Object.keys(ACCENTS))) || state.accent;
    if (q.has("gate")) state.gate = q.get("gate") === "1";
    if (q.has("backend")) state.backend = q.get("backend") !== "0";
    if (q.has("llm")) state.llm = q.get("llm") !== "0";
    if (q.has("sessions")) state.sessions = Math.max(0, Math.min(12, parseInt(q.get("sessions"), 10) || 0));
    if (q.has("combat")) state.combat = Math.max(0, Math.min(5, parseInt(q.get("combat"), 10) || 0));
    if (q.has("width")) state.width = parseFloat(q.get("width")) || 26;
    if (q.has("radius")) state.radius = parseFloat(q.get("radius")) || 1.25;
    if (q.has("alpha")) state.alpha = parseFloat(q.get("alpha")) || 1;
    if (q.has("dim")) state.dim = isNaN(parseFloat(q.get("dim"))) ? 1 : parseFloat(q.get("dim"));
    if (q.has("canvas")) state.canvas = q.get("canvas");
  }

  /* 把 state 写回设计台控件 */
  function syncControls() {
    $("#sessRange").value = state.sessions;   $("#sessOut").textContent = state.sessions;
    $("#combatRange").value = state.combat;   $("#combatOut").textContent = state.combat;
    $("#wRange").value = state.width;         $("#wOut").textContent = state.width + "rem";
    $("#rRange").value = state.radius;        $("#rOut").textContent = state.radius + "rem";
    $("#aRange").value = state.alpha;         $("#aOut").textContent = Math.round(state.alpha * 100) + "%";
    $("#dRange").value = state.dim;           $("#dOut").textContent = Math.round(state.dim * 100) + "%";
    $("#canvasSel").value = state.canvas;
    switchUI($("#gateSw"), state.gate);
    switchUI($("#backendSw"), state.backend);
    switchUI($("#llmSw"), state.llm);
  }

  /* ── 渲染：皮肤 ── */
  function applySkin() {
    root.classList.toggle("skin-prts", state.skin === "prts");
    root.classList.toggle("skin-tavern", state.skin === "tavern");
    seg($("#skinSeg"), "skin", state.skin);
  }

  /* ── 渲染：强调色 ── */
  function applyAccent() {
    if (state.accent === "skin") {
      ACCENT_VAR_NAMES.forEach(function (k) { root.style.removeProperty(k); });
      $("#accentHint").textContent = "跟随皮肤（不改任何变量）";
    } else {
      var vars = accentVars(ACCENTS[state.accent]);
      Object.keys(vars).forEach(function (k) { root.style.setProperty(k, vars[k]); });
      var a = ACCENTS[state.accent];
      $("#accentHint").textContent = "已覆盖：" + a.hi + " → " + a.mid + " → " + a.deep;
    }
    seg($("#accentSeg"), "accent", state.accent);
  }

  /* ── 渲染：状态 ── */
  function applyStatus() {
    $("#splash").hidden = !state.gate;
    $("#stage").classList.add("entered");

    var bd = $("#backendDot"), bt = $("#backendText");
    bd.className = "dot " + (state.backend ? "ok" : "bad");
    bt.textContent = state.backend ? "后端已连接" : "后端未连接";

    var ld = $("#llmDot"), lt = $("#llmText");
    ld.className = "dot " + (state.llm ? "ok" : "bad");
    lt.textContent = state.llm ? "deepseek" : "LLM 未配置";

    var badge = $("#sessionBadge");
    if (state.sessions > 0) {
      badge.hidden = false;
      badge.textContent = state.sessions + " 个会话" +
        (state.combat > 0 ? " · ⚔" + state.combat + " 战斗中" : "");
    } else {
      badge.hidden = true;
    }
  }

  /* ── 渲染：版式 ── */
  function applyLayout() {
    root.style.setProperty("--hm-col-maxw", state.width + "rem");
    root.style.setProperty("--hm-panel-radius", state.radius + "rem");
    root.style.setProperty("--hm-panel-alpha", String(state.alpha));
    root.style.setProperty("--hm-dim", String(state.dim));
    $("#wOut").textContent = state.width + "rem";
    $("#rOut").textContent = state.radius + "rem";
    $("#aOut").textContent = Math.round(state.alpha * 100) + "%";
    $("#dOut").textContent = Math.round(state.dim * 100) + "%";
  }

  /* ── 渲染：画布 ── */
  function applyCanvas() {
    var r = $("#homeRoot"), b = document.body;
    if (state.canvas === "fit") {
      b.classList.remove("canvas-fixed");
      r.style.width = ""; r.style.height = "";
      b.removeAttribute("data-canvas-label");
    } else {
      var p = state.canvas.split("x");
      b.classList.add("canvas-fixed");
      r.style.width = p[0] + "px";
      r.style.height = p[1] + "px";
      b.setAttribute("data-canvas-label", "画布 " + p[0] + " × " + p[1] + "（产品中为全屏，此处模拟视口）");
    }
  }

  /* ── 分段控件高亮 ── */
  function seg(box, attr, value) {
    Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) {
      b.classList.toggle("on", b.dataset[attr] === value);
    });
  }
  function switchUI(box, on) {
    Array.prototype.forEach.call(box.querySelectorAll("button"), function (b) {
      var v = b.dataset.v === "1";
      b.classList.toggle("on", v === on);
      b.classList.toggle("off", v !== on);
    });
  }

  /* ═══ 事件绑定 ═══ */
  var bindSeg = function (sel, attr, after) {
    $(sel).addEventListener("click", function (e) {
      var b = e.target.closest("button[data-" + attr + "]");
      if (!b) return;
      state[attr === "skin" ? "skin" : "accent"] = b.dataset[attr];
      after();
    });
  };
  bindSeg("#skinSeg", "skin", applySkin);
  bindSeg("#accentSeg", "accent", applyAccent);

  var bindSwitch = function (sel, key) {
    $(sel).addEventListener("click", function (e) {
      var b = e.target.closest("button[data-v]");
      if (!b) return;
      state[key] = b.dataset.v === "1";
      switchUI($(sel), state[key]);
      applyStatus();
    });
  };
  bindSwitch("#gateSw", "gate");
  bindSwitch("#backendSw", "backend");
  bindSwitch("#llmSw", "llm");

  var bindRange = function (sel, key, outSel, fmt, after) {
    $(sel).addEventListener("input", function (e) {
      state[key] = parseFloat(e.target.value);
      if (outSel) $(outSel).textContent = fmt(state[key]);
      after();
    });
  };
  bindRange("#sessRange", "sessions", "#sessOut", function (v) { return String(v); }, applyStatus);
  bindRange("#combatRange", "combat", "#combatOut", function (v) { return String(v); }, applyStatus);
  bindRange("#wRange", "width", "#wOut", function (v) { return v + "rem"; }, applyLayout);
  bindRange("#rRange", "radius", "#rOut", function (v) { return v + "rem"; }, applyLayout);
  bindRange("#aRange", "alpha", "#aOut", function (v) { return Math.round(v * 100) + "%"; }, applyLayout);
  bindRange("#dRange", "dim", "#dOut", function (v) { return Math.round(v * 100) + "%"; }, applyLayout);

  $("#canvasSel").addEventListener("change", function (e) {
    state.canvas = e.target.value;
    applyCanvas();
  });

  /* 闸门：真实交互（点击后展开菜单，满足自动播放策略） */
  var enter = function () { state.gate = false; switchUI($("#gateSw"), false); applyStatus(); };
  $("#splash").addEventListener("click", enter);
  $("#splash").addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); }
  });

  /* 首页底部音量/静音：仅示意（BGM 来自后端） */
  var muted = false;
  $("#muteBtn").addEventListener("click", function () {
    muted = !muted;
    this.textContent = muted ? "🔇" : "🔊";
  });
  var slider = document.querySelector(".home-vol-slider");
  slider.addEventListener("input", function () {
    this.title = "BGM 音量 " + Math.round(this.value * 100) + "%";
  });

  /* 菜单项：预览稿不做真实跳转，点击只给一个反馈 */
  Array.prototype.forEach.call(document.querySelectorAll(".home-menu-item"), function (b) {
    b.addEventListener("click", function () {
      console.log("[预览稿] 进入视图：", b.dataset.view);
    });
  });

  /* 设计台开合 */
  var bench = $("#bench"), fab = $("#benchFab");
  function toggleBench(force) {
    bench.hidden = typeof force === "boolean" ? !force : !bench.hidden;
    fab.textContent = bench.hidden ? "⚙ 设计台" : "✕ 关闭设计台";
  }
  fab.addEventListener("click", function () { toggleBench(); });

  /* 重置 */
  function reset() {
    state = defaults();
    syncControls();
    applySkin(); applyAccent(); applyStatus(); applyLayout(); applyCanvas();
  }
  $("#resetAll").addEventListener("click", reset);

  /* 快捷键 */
  document.addEventListener("keydown", function (e) {
    if (/^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
    var k = e.key.toLowerCase();
    if (k === "d") { toggleBench(); }
    else if (k === "escape") { toggleBench(false); }
    else if (k === "1" || k === "2" || k === "3") {
      state.skin = ["default", "prts", "tavern"][parseInt(k, 10) - 1];
      applySkin();
    } else if (k === "r") { reset(); }
  });

  /* 资源缺失时优雅降级（保持 ui-styles/ 与 frontend/ 的相对位置） */
  Array.prototype.forEach.call(document.querySelectorAll('img[src*="logo.png"]'), function (img) {
    img.addEventListener("error", function () {
      var ph = document.createElement("div");
      ph.className = img.className;
      ph.style.cssText = "display:flex;align-items:center;justify-content:center;" +
        "background:linear-gradient(135deg,rgba(245,158,11,.25),rgba(180,83,9,.15));" +
        "border:1px solid rgba(245,158,11,.4);font-size:22px;";
      ph.textContent = "🏮";
      img.replaceWith(ph);
    });
  });

  /* 初始化 */
  readQuery();
  syncControls();
  applySkin(); applyAccent(); applyStatus(); applyLayout(); applyCanvas();
})();
</script>

</body>
</html>
