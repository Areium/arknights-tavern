# ── 实体关系索引 ──
# 定义 entities 之间的属性归属和语义关系。
# properties: 跨层级属性（角色→势力/职业/种族）
# relations:   实体间的有类型关系
# 关系类型说明:
#   sibling     亲属（兄弟姐妹）
#   family      家族成员
#   ally        同盟/信任
#   colleague   同事
#   rival       敌对/竞争
#   employer    雇佣
#   protector   保护
#   leader      领导
#   member_of   所属（由 properties.faction 推断）
#   old_knowledge 旧识

entities:
  # ═══════════════════════════════════════
  # L3 行动者：角色
  # ═══════════════════════════════════════

  characters/临光:
    properties:
      faction: factions/临光家族
      class: classes/重装
      race: races/库兰塔
    relations:
      sibling: [characters/瑕光]
      family: [characters/玛恩纳·临光]
      ally: [characters/博士, characters/砾, characters/闪灵, factions/罗德岛]
      rival: [factions/商业联合会, factions/无胄盟]

  characters/瑕光:
    properties:
      faction: factions/临光家族
      class: classes/重装
      race: races/库兰塔
    relations:
      sibling: [characters/临光]
      family: [characters/玛恩纳·临光]
      ally: [characters/博士, characters/砾, factions/罗德岛]

  characters/砾:
    properties:
      faction: factions/罗德岛
      class: classes/特种
      race: races/扎拉克
    relations:
      ally: [characters/博士, characters/临光, characters/瑕光]
      old_knowledge: [characters/白金]

  characters/玛恩纳·临光:
    properties:
      faction: factions/临光家族
      class: classes/近卫
      race: races/库兰塔
    relations:
      family: [characters/临光, characters/瑕光]
      ally: [characters/博士]
      employer: [characters/托兰]

  characters/博士:
    properties:
      faction: factions/罗德岛
      class: classes/战术指挥
      race: races/未知
    relations:
      ally: [characters/阿米娅, characters/临光, characters/砾, characters/瑕光]
      colleague: [characters/凯尔希]

  characters/阿米娅:
    properties:
      faction: factions/罗德岛
      class: classes/术师
      race: races/卡特斯
    relations:
      ally: [characters/博士]
      colleague: [characters/凯尔希]

  characters/闪灵:
    properties:
      faction: factions/罗德岛
      class: classes/医疗
      race: races/萨卡兹
    relations:
      ally: [characters/临光, characters/博士]
      colleague: [characters/阿米娅]
      protector: [characters/夜莺]

  # ═══════════════════════════════════════
  # L2 世界实体：势力
  # ═══════════════════════════════════════

  factions/商业联合会:
    properties:
      type: organization
    relations:
      rival: [factions/监证会, factions/临光家族, factions/红松骑士团]
      ally: [factions/无胄盟]

  factions/无胄盟:
    properties:
      type: mercenary
    relations:
      rival: [factions/监证会, factions/红松骑士团]
      ally: [factions/商业联合会]

  factions/监证会:
    properties:
      type: organization
    relations:
      rival: [factions/商业联合会, factions/无胄盟]
      ally: [factions/临光家族]

  factions/红松骑士团:
    properties:
      type: rebellion
    relations:
      rival: [factions/商业联合会, factions/无胄盟]
      ally: [factions/临光家族]

  factions/临光家族:
    properties:
      type: organization
    relations:
      member_of: [characters/临光, characters/瑕光, characters/玛恩纳·临光]
      rival: [factions/商业联合会]
      ally: [factions/监证会, factions/红松骑士团]

  factions/罗德岛:
    properties:
      type: organization
    relations:
      leader: [characters/阿米娅, characters/博士]
      member_of: [characters/临光, characters/砾, characters/闪灵, characters/德克萨斯]
      rival: [factions/整合运动, factions/乌萨斯帝国]
      ally: [factions/龙门, factions/莱茵生命]
