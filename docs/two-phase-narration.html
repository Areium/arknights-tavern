<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>两阶段叙述 — Arknights Tavern</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  </noscript>
  <style>
    :root,
    [data-theme="dark"] {
      --bg: #020617;
      --grid: #1e293b;
      --text: #ffffff;
      --text-muted: #94a3b8;
      --text-dim: #475569;
      --panel: rgba(15, 23, 42, 0.5);
      --panel-border: #1e293b;
      --lane-fill: rgba(15, 23, 42, 0.22);
      --lane-stroke: #334155;
      --arrow: #64748b;
      --arrow-emphasis: #34d399;

      --frontend-fill:    rgba(8, 51, 68, 0.4);
      --frontend-stroke:  #22d3ee;
      --backend-fill:     rgba(6, 78, 59, 0.4);
      --backend-stroke:   #34d399;
      --database-fill:    rgba(76, 29, 149, 0.4);
      --database-stroke:  #a78bfa;
      --cloud-fill:       rgba(120, 53, 15, 0.3);
      --cloud-stroke:     #fbbf24;
      --security-fill:    rgba(136, 19, 55, 0.4);
      --security-stroke:  #fb7185;
      --messagebus-fill:  rgba(251, 146, 60, 0.3);
      --messagebus-stroke:#fb923c;
      --external-fill:    rgba(30, 41, 59, 0.5);
      --external-stroke:  #94a3b8;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --grid: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --panel: #ffffff;
      --panel-border: #e2e8f0;
      --lane-fill: rgba(248, 250, 252, 0.65);
      --lane-stroke: #cbd5e1;
      --arrow: #94a3b8;
      --arrow-emphasis: #059669;

      --frontend-fill:    rgba(34, 211, 238, 0.15);
      --frontend-stroke:  #0891b2;
      --backend-fill:     rgba(52, 211, 153, 0.18);
      --backend-stroke:   #059669;
      --database-fill:    rgba(167, 139, 250, 0.2);
      --database-stroke:  #7c3aed;
      --cloud-fill:       rgba(251, 191, 36, 0.18);
      --cloud-stroke:     #d97706;
      --security-fill:    rgba(251, 113, 133, 0.15);
      --security-stroke:  #e11d48;
      --messagebus-fill:  rgba(251, 146, 60, 0.15);
      --messagebus-stroke:#ea580c;
      --external-fill:    rgba(148, 163, 184, 0.18);
      --external-stroke:  #64748b;
    }

    html, body {
      margin: 0;
      background: var(--bg);
      font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas,
                   'Noto Sans Mono CJK SC', 'PingFang SC', 'Microsoft YaHei', monospace;
    }
    .wrap { max-width: 1680px; margin: 0 auto; padding: 8px 12px 24px; }
    svg { display: block; width: 100%; height: auto; }

    .t-primary { fill: var(--text); }
    .t-muted   { fill: var(--text-muted); }
    .t-dim     { fill: var(--text-dim); }
    .t-frontend   { fill: var(--frontend-stroke); }
    .t-backend    { fill: var(--backend-stroke); }
    .t-database   { fill: var(--database-stroke); }
    .t-cloud      { fill: var(--cloud-stroke); }
    .t-security   { fill: var(--security-stroke); }
    .t-messagebus { fill: var(--messagebus-stroke); }

    .lane { fill: var(--lane-fill); stroke: var(--lane-stroke); stroke-width: 1; }
    .panel-box { fill: var(--panel); stroke: var(--panel-border); stroke-width: 1; }

    .c-frontend   { fill: var(--frontend-fill);   stroke: var(--frontend-stroke); }
    .c-backend    { fill: var(--backend-fill);    stroke: var(--backend-stroke); }
    .c-database   { fill: var(--database-fill);   stroke: var(--database-stroke); }
    .c-cloud      { fill: var(--cloud-fill);      stroke: var(--cloud-stroke); }
    .c-security   { fill: var(--security-fill);   stroke: var(--security-stroke); }
    .c-messagebus { fill: var(--messagebus-fill); stroke: var(--messagebus-stroke); }
    .c-external   { fill: var(--external-fill);   stroke: var(--external-stroke); }

    g.node rect.body { transition: filter .15s ease; }
    g.node:hover rect.body { filter: brightness(1.3); }

    .a-default  { fill: none; stroke: var(--arrow); }
    .a-emphasis { fill: none; stroke: var(--arrow-emphasis); }
    .a-dashed   { fill: none; stroke: var(--arrow); stroke-dasharray: 5 4; }

    #theme-toggle {
      position: fixed; top: 10px; right: 14px; z-index: 10;
      background: var(--panel); color: var(--text-muted);
      border: 1px solid var(--lane-stroke); border-radius: 6px;
      font: inherit; font-size: 11px; padding: 4px 10px; cursor: pointer;
    }
    #theme-toggle:hover { color: var(--text); }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button">切换主题</button>
  <div class="wrap">
  <svg viewBox="0 0 1680 1040" role="img" aria-label="两阶段叙述节点图">
    <defs>
      <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="var(--grid)" stroke-width="0.5" opacity="0.35"/>
      </pattern>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/>
      </marker>
      <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow-emphasis)"/>
      </marker>
      <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="var(--arrow)"/>
      </marker>
    </defs>

    <rect x="0" y="0" width="1680" height="1040" fill="url(#grid)"/>

    <!-- ===== Header ===== -->
    <text x="48" y="54" class="t-primary" font-size="22" font-weight="700">两阶段叙述：创作与系统层解耦</text>
    <text x="48" y="78" class="t-muted" font-size="11">把「生成剧情」和「携带系统标记」拆成两个独立调用 —— 第一阶段只做叙述，第二阶段只做系统层，产物回注形成闭环</text>

    <!-- Problem box -->
    <g class="node">
      <rect x="48" y="100" width="740" height="68" rx="6" class="c-security body" stroke-width="1.2"/>
      <text x="64" y="123" class="t-security" font-size="10" font-weight="700">单阶段的问题：一项输出，两份职责</text>
      <text x="64" y="141" class="t-muted" font-size="9">一轮输出既要剧情质量又要格式纪律 —— 十分依赖模型能力，上下文越长越不守格式（掉括号、标记不全）</text>
      <text x="64" y="157" class="t-muted" font-size="9">而格式错误对叙事应用代价特别高：系统层解析失败，整轮都要重来</text>
    </g>

    <!-- Legend -->
    <rect x="1020" y="24" width="620" height="100" rx="6" class="panel-box"/>
    <rect x="1036" y="40" width="10" height="10" rx="2" class="c-backend"/>
    <text x="1052" y="49" class="t-muted" font-size="8">第一阶段·叙述</text>
    <rect x="1141" y="40" width="10" height="10" rx="2" class="c-frontend"/>
    <text x="1157" y="49" class="t-muted" font-size="8">第二阶段·系统层</text>
    <rect x="1261" y="40" width="10" height="10" rx="2" class="c-database"/>
    <text x="1277" y="49" class="t-muted" font-size="8">结构化产物</text>
    <rect x="1356" y="40" width="10" height="10" rx="2" class="c-messagebus"/>
    <text x="1372" y="49" class="t-muted" font-size="8">前端体验</text>
    <rect x="1441" y="40" width="10" height="10" rx="2" class="c-security"/>
    <text x="1457" y="49" class="t-muted" font-size="8">问题 / 风险</text>

    <path d="M 1036 68 L 1066 68" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="1072" y="71" class="t-muted" font-size="8">调用内数据流</text>
    <path d="M 1160 68 L 1190 68" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
    <text x="1196" y="71" class="t-muted" font-size="8">阶段间交接</text>
    <path d="M 1310 68 L 1340 68" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
    <text x="1346" y="71" class="t-muted" font-size="8">回注 / 确定性解析</text>
    <text x="1036" y="96" class="t-dim" font-size="8">第二阶段产物作为结果召回注入下一轮第一阶段，形成闭环；节拍内硬编码战斗标记由代码解析，优先级高于模型提取</text>

    <!-- ===== Lanes ===== -->
    <rect x="40" y="190" width="520" height="370" rx="10" class="lane"/>
    <text x="56" y="214" class="t-dim" font-size="10" font-weight="600">第一阶段 · 只做叙述</text>

    <rect x="640" y="190" width="720" height="370" rx="10" class="lane"/>
    <text x="656" y="214" class="t-dim" font-size="10" font-weight="600">第二阶段 · 只做系统层（独立轻量调用）</text>

    <rect x="1400" y="190" width="240" height="370" rx="10" class="lane"/>
    <text x="1416" y="214" class="t-dim" font-size="10" font-weight="600">产物与回注</text>

    <!-- ===== Edges ===== -->
    <path d="M 280 305 L 280 335" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <path d="M 280 415 L 280 445" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="296" y="434" class="t-muted" font-size="8">流式 SSE</text>

    <!-- stream -> phase2 input -->
    <path d="M 490 482 L 596 482 Q 604 482 604 474 L 604 276 Q 604 268 612 268 L 670 268" class="a-emphasis" stroke-width="1.8" marker-end="url(#arrowhead-emphasis)"/>
    <text x="543" y="474" class="t-muted" font-size="8" text-anchor="middle">本轮叙述文本</text>

    <!-- phase2 internal -->
    <path d="M 970 267 L 1010 267" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <path d="M 1170 305 L 1170 350" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <path d="M 1000 440 L 1000 470" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>

    <!-- repair -> output -->
    <path d="M 1330 505 L 1366 505 Q 1374 505 1374 497 L 1374 358 Q 1374 350 1382 350 L 1420 350" class="a-default" stroke-width="1.5" marker-end="url(#arrowhead)"/>
    <text x="1366" y="497" class="t-muted" font-size="8" text-anchor="end">解析产物</text>

    <!-- hardcoded marker -> output -->
    <path d="M 1520 470 L 1520 440" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>

    <!-- loop: output -> next round phase1 -->
    <path d="M 1500 560 L 1500 584 Q 1500 592 1492 592 L 62 592 Q 54 592 54 584 L 54 276 Q 54 268 62 268 L 70 268" class="a-dashed" stroke-width="1.5" marker-end="url(#arrowhead-dashed)"/>
    <text x="800" y="584" class="t-muted" font-size="8" text-anchor="middle">结果召回：战斗简报 / 节拍推进 / 摘要 / 环境状态 → 注入下一轮第一阶段</text>

    <!-- ===== Phase 1 nodes ===== -->
    <g class="node">
      <rect x="70" y="230" width="420" height="75" rx="6" class="c-backend body" stroke-width="1.5"/>
      <text x="280" y="258" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">提示词组装（干净上下文）</text>
      <text x="280" y="276" class="t-muted" font-size="8" text-anchor="middle">没有任何标记与格式规则 · 只有创作指令</text>
      <text x="280" y="293" class="t-backend" font-size="7.5" text-anchor="middle">模型专注创作，不与格式纪律争抢注意力</text>
    </g>

    <g class="node">
      <rect x="70" y="335" width="420" height="80" rx="6" class="c-backend body" stroke-width="1.5"/>
      <text x="280" y="365" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">LLM 叙述生成</text>
      <text x="280" y="383" class="t-muted" font-size="8" text-anchor="middle">只输出剧情文本</text>
    </g>

    <g class="node">
      <rect x="70" y="445" width="420" height="75" rx="6" class="c-messagebus body" stroke-width="1.5"/>
      <text x="280" y="473" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">流式推送前端</text>
      <text x="280" y="491" class="t-muted" font-size="8" text-anchor="middle">边生成边渲染</text>
      <text x="280" y="508" class="t-messagebus" font-size="7.5" text-anchor="middle">首字延迟 ≈ 模型首 token 时间</text>
    </g>

    <!-- ===== Phase 2 nodes ===== -->
    <g class="node">
      <rect x="670" y="230" width="300" height="75" rx="6" class="c-frontend body" stroke-width="1.5"/>
      <text x="820" y="258" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">输入：本轮叙述文本</text>
      <text x="820" y="276" class="t-muted" font-size="8" text-anchor="middle">不带会话历史</text>
      <text x="820" y="293" class="t-frontend" font-size="7.5" text-anchor="middle">上下文成本 ∝ 本轮长度</text>
    </g>

    <g class="node">
      <rect x="1010" y="230" width="320" height="75" rx="6" class="c-frontend body" stroke-width="1.5"/>
      <text x="1170" y="258" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">轻量 LLM 调用</text>
      <text x="1170" y="276" class="t-muted" font-size="8" text-anchor="middle">分类提取任务 · 关闭思考模式</text>
      <text x="1170" y="293" class="t-frontend" font-size="7.5" text-anchor="middle">空响应率 &gt;40% → 0 · 可用更小模型</text>
    </g>

    <g class="node">
      <rect x="670" y="350" width="660" height="90" rx="6" class="c-frontend body" stroke-width="1.5"/>
      <text x="1000" y="378" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">动态组装的任务列表</text>
      <text x="1000" y="396" class="t-muted" font-size="8" text-anchor="middle">战斗触发判断 · 选项生成 · 剧情摘要 · 环境变更</text>
      <text x="1000" y="412" class="t-muted" font-size="8" text-anchor="middle">不受剧情上下文包袱干扰</text>
      <text x="1000" y="429" class="t-frontend" font-size="7.5" text-anchor="middle">加系统功能 = 插一个任务 + 一个解析器 · 检定 / wiki 预取以钩子挂入</text>
    </g>

    <g class="node">
      <rect x="670" y="470" width="660" height="70" rx="6" class="c-database body" stroke-width="1.5"/>
      <text x="1000" y="498" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">三级 JSON 修复兜底</text>
      <text x="1000" y="516" class="t-muted" font-size="8" text-anchor="middle">直接解析 → 标点相邻引号替换 → 字段锚点扫描</text>
      <text x="1000" y="532" class="t-database" font-size="7.5" text-anchor="middle">即使掉格式，也不必牺牲整轮输出</text>
    </g>

    <!-- ===== Output lane nodes ===== -->
    <g class="node">
      <rect x="1420" y="260" width="200" height="180" rx="6" class="c-database body" stroke-width="1.5"/>
      <text x="1520" y="288" class="t-primary" font-size="11" font-weight="600" text-anchor="middle">结构化产物</text>
      <text x="1436" y="316" class="t-muted" font-size="8.5">· 战斗简报 / 触发</text>
      <text x="1436" y="338" class="t-muted" font-size="8.5">· 节拍推进</text>
      <text x="1436" y="360" class="t-muted" font-size="8.5">· 选项 [CHOICES]</text>
      <text x="1436" y="382" class="t-muted" font-size="8.5">· 剧情摘要</text>
      <text x="1436" y="404" class="t-muted" font-size="8.5">· 环境状态变更</text>
      <text x="1520" y="428" class="t-database" font-size="7.5" text-anchor="middle">系统层的全部产出</text>
    </g>

    <g class="node">
      <rect x="1420" y="470" width="200" height="70" rx="6" class="c-external body" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x="1520" y="494" class="t-primary" font-size="9.5" font-weight="600" text-anchor="middle">硬编码战斗标记</text>
      <text x="1520" y="511" class="t-muted" font-size="7.5" text-anchor="middle">作者在节拍中编写</text>
      <text x="1520" y="526" class="t-muted" font-size="7.5" text-anchor="middle">代码确定性解析 · 优先级更高</text>
    </g>

    <!-- ===== Benefit cards ===== -->
    <g class="node">
      <rect x="70" y="700" width="500" height="160" rx="6" class="c-backend body" stroke-width="1.5"/>
      <circle cx="98" cy="727" r="13" fill="var(--backend-fill)" stroke="var(--backend-stroke)" stroke-width="1.2"/>
      <text x="98" y="731.5" class="t-backend" font-size="12" font-weight="700" text-anchor="middle">1</text>
      <text x="120" y="732" class="t-primary" font-size="11.5" font-weight="600">扩展性</text>
      <text x="90" y="757" class="t-muted" font-size="8.5">第二阶段的任务列表是动态组装的</text>
      <text x="90" y="775" class="t-muted" font-size="8.5">加系统功能 = 插任务 + 加解析器，第一阶段一个字不用动</text>
      <text x="90" y="793" class="t-muted" font-size="8.5">检定系统 / wiki 预取均以钩子形式挂进这条链路</text>
      <text x="90" y="837" class="t-backend" font-size="7.5">叙述质量始终不受系统逻辑侵入</text>
    </g>

    <g class="node">
      <rect x="585" y="700" width="500" height="160" rx="6" class="c-cloud body" stroke-width="1.5"/>
      <circle cx="613" cy="727" r="13" fill="var(--cloud-fill)" stroke="var(--cloud-stroke)" stroke-width="1.2"/>
      <text x="613" y="731.5" class="t-cloud" font-size="12" font-weight="700" text-anchor="middle">2</text>
      <text x="635" y="732" class="t-primary" font-size="11.5" font-weight="600">成本</text>
      <text x="605" y="757" class="t-muted" font-size="8.5">两个调用完全解耦 → 按各自任务特性异构配置</text>
      <text x="605" y="775" class="t-muted" font-size="8.5">分类提取任务实测：关思考模式，空响应率 &gt;40% → 0</text>
      <text x="605" y="793" class="t-muted" font-size="8.5">可用更小模型、更低推理预算；输入只有本轮叙述文本</text>
      <text x="605" y="837" class="t-cloud" font-size="7.5">上下文成本与会话总长无关 —— 长会话下成本曲线是平的</text>
    </g>

    <g class="node">
      <rect x="1100" y="700" width="500" height="160" rx="6" class="c-database body" stroke-width="1.5"/>
      <circle cx="1128" cy="727" r="13" fill="var(--database-fill)" stroke="var(--database-stroke)" stroke-width="1.2"/>
      <text x="1128" y="731.5" class="t-database" font-size="12" font-weight="700" text-anchor="middle">3</text>
      <text x="1150" y="732" class="t-primary" font-size="11.5" font-weight="600">可靠性</text>
      <text x="1120" y="757" class="t-muted" font-size="8.5">三级 JSON 修复兜底：直接解析 → 引号替换 → 字段锚点扫描</text>
      <text x="1120" y="775" class="t-muted" font-size="8.5">硬编码战斗标记由代码确定性解析，优先级高于模型提取</text>
      <text x="1120" y="793" class="t-muted" font-size="8.5">模型掉格式不再意味着整轮重来</text>
      <text x="1120" y="837" class="t-database" font-size="7.5">为战斗嵌入与系统判定提供挂载点</text>
    </g>

    <!-- ===== Experience banner ===== -->
    <rect x="40" y="890" width="1600" height="110" rx="8" class="panel-box" stroke="var(--arrow-emphasis)" stroke-width="1.2"/>
    <text x="68" y="918" class="t-primary" font-size="11" font-weight="700">体验对比 · 感知响应速度</text>

    <text x="68" y="947" class="t-muted" font-size="8.5">单阶段</text>
    <rect x="140" y="937" width="700" height="14" rx="3" fill="var(--security-stroke)" opacity="0.75"/>
    <text x="852" y="948" class="t-muted" font-size="8.5">「剧情 + 全部标记」整体生成完，用户才能看到完整交互</text>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      try {
        var saved = localStorage.getItem('rag-diagram-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (_) {}
      btn.addEventListener('click', function () {
        var cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', cur);
        try { localStorage.setItem('rag-diagram-theme', cur); } catch (_) {}
      });
    })();
  </script>
